# Builds the Mac app (.dmg) on GitHub's own Mac computers.
# Start it from the repository's Actions tab ("Build Mac app" → "Run workflow"),
# or push a tag such as v1.0.0 to also publish a Release with the files attached.
name: Build Mac app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tools
        run: npm install

      - name: Build the Mac app
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Keep the files for download
        uses: actions/upload-artifact@v4
        with:
          name: ID-Card-Studio-Mac
          path: |
            dist/*.dmg

      - name: Publish a Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
