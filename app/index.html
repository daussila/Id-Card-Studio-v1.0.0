<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ID Card Studio</title>
  <meta name="description" content="Create card lists from CSV files, design ID cards, take photos, and print.">
  <meta name="theme-color" content="#185adb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <style>
    * {box-sizing:border-box}
    html,body {height:100%;margin:0}
    body {display:flex;flex-direction:column;font:14px 'Segoe UI',Arial,sans-serif;color:#172033;background:#e9eef5}
    [hidden] {display:none!important}
    .app-header {flex:none;padding:14px 22px 0;background:#f7f9fc;border-bottom:1px solid #cbd5e1}
    .heading {display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .heading > div {flex:1;min-width:0}
    .mark {display:grid;place-items:center;flex:0 0 38px;width:38px;height:38px;border-radius:10px;background:#185adb}
    h1 {margin:0;font-size:22px}
    .hint {margin:3px 0 0;font-size:12px;color:#667085}
    /* School name next to the logo: click to change it */
    .heading > .school {flex:0 1 auto;display:flex;align-items:center;justify-content:flex-end;min-width:0;max-width:min(520px,48vw)}
    .school-name {min-width:0;max-width:100%;padding:6px 10px;border:1px solid transparent;border-radius:8px;background:transparent;color:#172033;font:700 19px 'Segoe UI',-apple-system,BlinkMacSystemFont,Arial,sans-serif;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
    .school-name:hover {border-color:#cbd5e1;background:#fff}
    .school-name.empty {padding:7px 12px;border:1px dashed #98a2b3;border-radius:999px;color:#475467;font-size:13px;font-weight:600}
    .school-name.empty:hover {border-color:#185adb;color:#174ea6}
    .school-input {width:min(420px,46vw);padding:7px 10px;border:1px solid #185adb;border-radius:8px;font:700 17px 'Segoe UI',-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#172033;outline:3px solid rgba(24,90,219,.15)}
    .org-logo {flex:0 0 auto;width:48px;height:48px;object-fit:contain}
    .tabs {display:flex;gap:6px;overflow-x:auto}
    .tabs button {flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:44px;padding:10px 18px;border:1px solid transparent;border-bottom:3px solid transparent;border-radius:8px 8px 0 0;background:transparent;color:#475467;font:600 14px 'Segoe UI',Arial,sans-serif;cursor:pointer}
    .tabs button:hover {background:#e8eef7}
    .tabs button[aria-selected=true] {background:#e7effd;color:#174ea6;border-color:#c6d5ef;border-bottom-color:#185adb}
    .tabs button:focus-visible,.school-name:focus-visible {outline:2px solid #185adb;outline-offset:-3px}
    .tabs svg {width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    #workspaces {position:relative;flex:1;min-height:0}
    .workspace {position:absolute;inset:0;visibility:hidden;pointer-events:none}
    .workspace.active {visibility:visible;pointer-events:auto}
    iframe {display:block;width:100%;height:100%;border:0;background:#eef2f7}
    .load-state {position:absolute;inset:0;z-index:1;display:grid;place-content:center;gap:12px;padding:30px;text-align:center;background:#eef2f7}
    .load-state p {max-width:520px;margin:0;line-height:1.5}
    .load-state button {justify-self:center;padding:9px 16px;border:1px solid #b4c3d8;border-radius:7px;background:#fff;color:#172033;cursor:pointer}
    /* First start of the Edge/Chrome version: choose the data folder */
    .gate {position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#f7f9fc,#e3eaf5)}
    .gate-card {width:min(560px,100%);padding:30px;background:#fff;border:1px solid #d0d5dd;border-radius:16px;box-shadow:0 20px 50px rgba(23,32,51,.14)}
    .gate-card h2 {margin:14px 0 8px;font-size:22px}
    .gate-card p {margin:0 0 12px;color:#475467;line-height:1.55}
    .gate-card ul {margin:0 0 16px;padding-left:20px;color:#475467;line-height:1.7}
    .gate-card .primary {width:100%;min-height:44px;margin-top:6px;border:0;border-radius:9px;background:#185adb;color:#fff;font:700 15px 'Segoe UI',Arial,sans-serif;cursor:pointer}
    .gate-card .primary:hover {background:#1248b5}
    .gate-card .secondary {margin-top:10px;padding:7px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#344054;font:600 13px 'Segoe UI',Arial,sans-serif;cursor:pointer}
    .gate-error {min-height:20px;margin:12px 0 0!important;color:#b42318!important;font-weight:600}
    .pending {display:flex;flex-direction:column;gap:6px;margin:12px 0 0}
    .pending button {display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;font:600 13px 'Segoe UI',Arial,sans-serif;cursor:pointer}
    .pending button.done {border-color:#a6dcb5;background:#effaf2;color:#166534;cursor:default}
    @media(max-width:600px) {.org-logo {width:38px;height:38px}.school-name {font-size:15px}.app-header {padding:10px 10px 0}h1 {font-size:20px}.tabs button {padding:10px 12px}.hint {display:none}}
  </style>
</head>
<body>
  <header class="app-header">
    <div class="heading">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="30" height="30" focusable="false"><rect x="6" y="3" width="20" height="26" rx="3" fill="white"/><rect x="12" y="5" width="8" height="2.5" rx="1.25" fill="#185adb"/><circle cx="12" cy="13" r="2.5" fill="#185adb"/><path d="M8.5 20v-1a3.5 3.5 0 0 1 7 0v1Z" fill="#185adb"/><path d="M18.5 12.5h4M18.5 16.5h4M9.5 24h13" fill="none" stroke="#185adb" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      <div><h1>ID Card Studio</h1><p class="hint">Create your own card lists, design cards, take photos, and print — all in one place.</p></div>
      <div class="school" id="school" hidden>
        <button id="schoolName" class="school-name" type="button"></button>
        <input id="schoolInput" class="school-input" type="text" maxlength="80" placeholder="School name" aria-label="School name" hidden>
      </div>
      <img class="org-logo" src="icons/school-logo.png" alt="School logo">
    </div>
    <nav class="tabs" role="tablist" aria-label="ID Card Studio sections" id="studioTabs">
      <button id="tab-cards" role="tab" type="button" data-studio="cards" aria-controls="panel-cards" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3"/><circle cx="8" cy="10" r="2"/><path d="M4 17q4-6 8 0 M15 9h4 M15 13h4"/></svg>Card Studio</button>
      <button id="tab-design" role="tab" type="button" data-studio="design" aria-controls="panel-design" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16 12-12 4 4L8 20H4Z M13 7l4 4"/></svg>Design Studio</button>
    </nav>
  </header>
  <main id="workspaces" aria-label="Studio workspace"></main>

  <!-- Edge/Chrome version only: the folder where photos, designs and settings are kept -->
  <section id="gate" class="gate" hidden>
    <div class="gate-card">
      <span class="mark" aria-hidden="true" style="width:46px;height:46px"><svg viewBox="0 0 32 32" width="34" height="34"><rect x="6" y="3" width="20" height="26" rx="3" fill="white"/><circle cx="12" cy="13" r="2.5" fill="#185adb"/><path d="M8.5 20v-1a3.5 3.5 0 0 1 7 0v1Z" fill="#185adb"/><path d="M18.5 12.5h4M18.5 16.5h4M9.5 24h13" fill="none" stroke="#185adb" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      <h2 id="gateTitle">Welcome to ID Card Studio</h2>
      <div id="gateBody"></div>
      <div id="gatePending" class="pending" hidden></div>
      <p id="gateError" class="gate-error" role="alert"></p>
    </div>
  </section>

<script src="csv.js"></script>
<script src="platform.js"></script>
<script src="local-server.js"></script>
<script>
(function () {
  'use strict';
  const initialTab = location.hash === '#design' ? 'design' : 'cards';
  const panels = new Map();
  const tabBar = document.getElementById('studioTabs');
  const workspace = document.getElementById('workspaces');
  const $ = id => document.getElementById(id);
  let active = '';
  let server = null;
  const platform = IDCSPlatform.create();

  const buttonFor = type => document.getElementById('tab-' + type);
  const call = (name, ...args) => new Promise((resolve, reject) =>
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));

  function panelFor(type) {
    if (panels.has(type)) return panels.get(type);
    const panel = document.createElement('section');
    panel.id = 'panel-' + type;
    panel.className = 'workspace';
    panel.setAttribute('role', 'tabpanel');
    panel.setAttribute('aria-labelledby', 'tab-' + type);
    const state = document.createElement('div');
    state.className = 'load-state';
    const text = document.createElement('p');
    text.setAttribute('role', 'status');
    const retry = document.createElement('button');
    retry.type = 'button';
    retry.textContent = 'Try Again';
    retry.hidden = true;
    state.append(text, retry);
    panel.appendChild(state);
    workspace.appendChild(panel);
    const entry = {type, panel, state, text, retry, frame: null, loading: false, generation: 0, list: ''};
    retry.onclick = () => load(entry);
    panels.set(type, entry);
    return entry;
  }

  function fail(entry, message) {
    entry.loading = false;
    entry.text.textContent = message;
    entry.retry.hidden = false;
    entry.state.hidden = false;
  }

  async function load(entry) {
    if (entry.loading) return;
    entry.loading = true;
    entry.state.hidden = false;
    entry.retry.hidden = true;
    entry.text.textContent = 'Opening ' + buttonFor(entry.type).textContent.trim() + '…';
    const generation = ++entry.generation;
    try {
      const result = await call('getStudioTabHtml', entry.type, entry.list || '');
      if (entry.generation !== generation) return;
      if (!result || result.studio !== entry.type || typeof result.html !== 'string') throw new Error('The page could not be loaded.');
      entry.list = result.list || '';
      if (entry.frame) entry.frame.remove();
      const frame = document.createElement('iframe');
      frame.title = buttonFor(entry.type).textContent.trim();
      frame.allow = 'camera; microphone; clipboard-write';
      entry.frame = frame;
      // srcdoc pages share this window's origin, so they can use the local server and storage.
      frame.srcdoc = result.html;
      entry.panel.appendChild(frame);
      setTimeout(() => {
        if (entry.loading && entry.generation === generation) fail(entry, 'This page is taking longer to open. You can try again.');
      }, 30000);
    } catch (error) {
      if (entry.generation === generation) fail(entry, 'Unable to open this page: ' + (error.message || String(error)));
    }
  }

  function select(type, focus) {
    const button = buttonFor(type);
    if (!button) return;
    const previous = panels.get(active);
    if (previous && previous.frame && active !== type) {
      previous.frame.contentWindow.dispatchEvent(new previous.frame.contentWindow.Event('blur'));
    }
    active = type;
    const entry = panelFor(type);
    tabBar.querySelectorAll('[role=tab]').forEach(tab => {
      const current = tab.dataset.studio === type;
      tab.setAttribute('aria-selected', String(current));
      tab.tabIndex = current ? 0 : -1;
    });
    panels.forEach(item => {
      const current = item.type === type;
      item.panel.classList.toggle('active', current);
      item.panel.setAttribute('aria-hidden', String(!current));
      item.panel.inert = !current;
    });
    if (!entry.frame && !entry.loading) load(entry);
    else if (entry.frame && !entry.loading) {
      const child = entry.frame.contentWindow;
      child.dispatchEvent(new child.Event('resize'));
      child.dispatchEvent(new child.Event('focus'));
    }
    if (focus) button.focus();
  }

  /** A page signals unsaved work by cancelling its beforeunload event. */
  function hasUnsaved(entry) {
    if (!entry.frame) return false;
    try {
      const child = entry.frame.contentWindow;
      return !child.dispatchEvent(new child.Event('beforeunload', {cancelable: true}));
    } catch (error) {
      return false;
    }
  }

  /** Reloads a tab; for Card Studio, listId switches to that list. */
  function reload(entry, listId) {
    if (hasUnsaved(entry) && !confirm('This page has unsaved changes. Reload it anyway?')) return;
    if (listId) entry.list = listId;
    entry.loading = false;
    load(entry);
  }

  window.IDStudioTabs = Object.freeze({
    connect(child) {
      const entry = Array.from(panels.values()).find(item => item.frame && item.frame.contentWindow === child);
      if (!entry) return null;
      const generation = entry.generation;
      const isCurrent = () => entry.generation === generation && entry.frame && entry.frame.contentWindow === child;
      return Object.freeze({
        reload(listId) { if (isCurrent()) reload(entry, typeof listId === 'string' ? listId : ''); },
        refreshAccess() {},
        ready() {
          if (!isCurrent()) return;
          entry.loading = false;
          entry.state.hidden = true;
          if (active === entry.type) child.dispatchEvent(new child.Event('resize'));
        }
      });
    }
  });

  tabBar.addEventListener('click', event => {
    const button = event.target.closest('[role=tab]');
    if (button) select(button.dataset.studio, true);
  });
  tabBar.addEventListener('keydown', event => {
    const tabs = Array.from(tabBar.querySelectorAll('[role=tab]'));
    let index = tabs.indexOf(document.activeElement);
    if (index < 0) return;
    if (event.key === 'ArrowRight') index = (index + 1) % tabs.length;
    else if (event.key === 'ArrowLeft') index = (index + tabs.length - 1) % tabs.length;
    else if (event.key === 'Home') index = 0;
    else if (event.key === 'End') index = tabs.length - 1;
    else return;
    event.preventDefault();
    select(tabs[index].dataset.studio, true);
  });
  window.addEventListener('beforeunload', event => {
    if (Array.from(panels.values()).some(hasUnsaved)) {
      event.preventDefault();
      event.returnValue = '';
    }
  });

  // ---------- School name ----------
  let schoolName = '';
  function showSchoolName() {
    const button = $('schoolName');
    $('school').hidden = false;
    button.classList.toggle('empty', !schoolName);
    button.textContent = schoolName || '＋ Add school name';
    button.title = schoolName ? 'Click to change the school name' : 'Add your school’s name';
    document.title = schoolName ? 'ID Card Studio — ' + schoolName : 'ID Card Studio';
  }
  function editSchoolName() {
    const input = $('schoolInput');
    $('schoolName').hidden = true;
    input.hidden = false;
    input.value = schoolName;
    input.focus();
    input.select();
  }
  async function finishSchoolName(save) {
    const input = $('schoolInput');
    if (input.hidden) return;
    input.hidden = true;
    $('schoolName').hidden = false;
    if (save && input.value.trim().replace(/\s+/g, ' ') !== schoolName) {
      try { schoolName = await server.saveSchoolName(input.value); } catch (error) { alert(error.message || error); }
    }
    showSchoolName();
    $('schoolName').focus();
  }
  $('schoolName').onclick = editSchoolName;
  $('schoolInput').addEventListener('keydown', event => {
    if (event.key === 'Enter') { event.preventDefault(); finishSchoolName(true); }
    if (event.key === 'Escape') { event.preventDefault(); finishSchoolName(false); }
  });
  $('schoolInput').addEventListener('blur', () => finishSchoolName(true));

  async function start() {
    server = IDCSLocalServer.create(platform);
    await server.init();
    window.google = IDCSLocalServer.googleShim(server);
    $('gate').hidden = true;
    schoolName = await server.getSchoolName().catch(() => '');
    showSchoolName();
    select(initialTab, false);
  }

  /** Edge/Chrome: choose the data folder once; later starts only need a click to allow it again. */
  function showGate(status) {
    const gate = $('gate');
    const body = $('gateBody');
    const error = $('gateError');
    gate.hidden = false;
    error.textContent = '';
    const button = (label, className, action) => {
      const node = document.createElement('button');
      node.type = 'button';
      node.className = className;
      node.textContent = label;
      node.onclick = async () => {
        error.textContent = '';
        node.disabled = true;
        try { await action(); } catch (failure) {
          if (!failure || failure.name !== 'AbortError') error.textContent = failure.message || String(failure);
        } finally { node.disabled = false; }
      };
      return node;
    };
    if (status.reason === 'unsupported') {
      $('gateTitle').textContent = 'Please use Microsoft Edge or Google Chrome';
      body.innerHTML = '<p>This version of ID Card Studio saves photos and CSV changes directly in a folder on your computer. Only Microsoft Edge and Google Chrome on a computer can do that.</p>';
      return;
    }
    if (status.reason === 'choose') {
      $('gateTitle').textContent = 'Welcome to ID Card Studio';
      body.innerHTML = '<p>Choose a folder where ID Card Studio keeps its files — for example a new folder called <b>ID Card Studio</b> in Documents. It will contain:</p>' +
        '<ul><li><b>Photos</b> — one folder per list</li><li><b>Designs</b> — card designs saved in Design Studio</li><li><b>Data</b> — your CSV files</li><li><b>settings.json</b> — your lists and their settings</li></ul>' +
        '<p>Everything stays on this computer.</p>';
      body.appendChild(button('Choose folder…', 'primary', async () => { await platform.chooseFolder(); await afterAccess(); }));
      return;
    }
    $('gateTitle').textContent = 'Continue to ID Card Studio';
    body.innerHTML = '<p>To keep your files private, the browser asks once per session before ID Card Studio may use the folder <b></b> again. Choose “Allow on every visit” to skip this next time.</p>';
    body.querySelector('b').textContent = status.folderName || 'ID Card Studio';
    body.appendChild(button('Continue', 'primary', async () => { await platform.allowAgain(); await afterAccess(); }));
    body.appendChild(button('Use a different folder…', 'secondary', async () => { await platform.chooseFolder(); await afterAccess(); }));
  }
  /** CSV files outside the data folder each need their own OK (one click each). */
  async function afterAccess() {
    const pending = await platform.pendingPermissions();
    if (!pending.length) return start();
    $('gate').hidden = false;
    const host = $('gatePending');
    $('gateTitle').textContent = 'Allow your CSV files';
    $('gateBody').innerHTML = '<p>These CSV files are outside the data folder. Click each one to let ID Card Studio save changes into it. (Tip: keep CSV files in the <b>Data</b> folder to skip this step.)</p>';
    host.hidden = false;
    host.replaceChildren();
    pending.forEach(item => {
      const node = document.createElement('button');
      node.type = 'button';
      node.innerHTML = '<span></span><span>Allow</span>';
      node.firstChild.textContent = item.name;
      node.onclick = async () => {
        if (await platform.allowSource(item.token).catch(() => false)) {
          node.classList.add('done');
          node.lastChild.textContent = '✓ Allowed';
          node.disabled = true;
        }
      };
      host.appendChild(node);
    });
    const go = document.createElement('button');
    go.type = 'button';
    go.className = 'primary';
    go.textContent = 'Open ID Card Studio';
    go.onclick = () => { host.hidden = true; start(); };
    $('gateBody').appendChild(go);
  }

  (async function boot() {
    try {
      const status = await platform.init();
      if (status.ready) await afterAccess();
      else showGate(status);
    } catch (error) {
      $('gate').hidden = false;
      $('gateTitle').textContent = 'ID Card Studio could not start';
      $('gateBody').textContent = error.message || String(error);
    }
  })();

  // Edge/Chrome version: works offline and can be installed as an app.
  if (!window.idcsNative && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
